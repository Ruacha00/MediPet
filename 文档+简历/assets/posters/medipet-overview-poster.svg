<title id="title">MediPet｜把就诊对话连接到真实业务状态</title><desc id="desc">面向门诊服务的多 Agent 就诊助手 · 六角色协作 · 有界医疗信息 · 可复核证据。对应 MediPet U001，源码基准 bb0600c。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6c8499"/></marker></defs>
<rect width="1440" height="1500" fill="#f3f6fa"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif">
<text id="text-1" x="40" y="45" font-size="15" font-weight="700" fill="#087f83" data-max-width="1200">MEDIPET  /  ENGINEERING GUIDE</text>
<text id="text-2" x="40" y="98" font-size="34" font-weight="700" fill="#182f48" data-max-width="1300">MediPet｜把就诊对话连接到真实业务状态</text>
<text id="text-3" x="40" y="134" font-size="18" font-weight="400" fill="#597087" data-max-width="1360">面向门诊服务的多 Agent 就诊助手 · 六角色协作 · 有界医疗信息 · 可复核证据</text>
<text id="text-4" x="40" y="1473" font-size="15" font-weight="400" fill="#597087" data-max-width="670">07  /  U001 · bb0600c · 2026-09-16</text>
<text id="text-5" x="810" y="1473" font-size="15" font-weight="400" fill="#597087" data-max-width="600">就诊服务场景  ·  图中范围以配套教程与源码为准</text>
<rect x="40" y="181" width="1360" height="115" rx="14" fill="#e8f3f3" stroke="#dbe4ed"/>
<text id="text-6" x="62" y="217" font-size="22" font-weight="700" fill="#087f83" data-max-width="1316">患者与事项贯穿整个流程</text>
<text id="text-7" x="62" y="250" font-size="18" font-weight="400" fill="#20384f" data-max-width="1316">选患者 → 查询资料与号源 → 核对方案 → 点击确认 → 获得实际回执 → 恢复历史</text>
<text id="text-8" x="62" y="278" font-size="18" font-weight="400" fill="#20384f" data-max-width="1316">为本人或家属办理；对话帮助理解，程序负责库存、身份、状态与结构化卡片。</text>
<rect x="40" y="340" width="430" height="158" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="40" y="356" width="5" height="32" rx="2" fill="#087f83"/>
<text id="text-9" x="62" y="379" font-size="24" font-weight="700" fill="#087f83" data-max-width="386">General / 医院信息</text>
<text id="text-10" x="62" y="416" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">医院、科室、医生与澄清</text>
<text id="text-11" x="62" y="446" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">公开目录或静态检索</text>
<rect x="505" y="340" width="430" height="158" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="505" y="356" width="5" height="32" rx="2" fill="#3c62ad"/>
<text id="text-12" x="527" y="379" font-size="24" font-weight="700" fill="#3c62ad" data-max-width="386">Guidance / 就诊指引</text>
<text id="text-13" x="527" y="416" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">材料、报到与文字路线</text>
<text id="text-14" x="527" y="446" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">已知起终点时直接查询</text>
<rect x="970" y="340" width="430" height="158" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="970" y="356" width="5" height="32" rx="2" fill="#087f83"/>
<text id="text-15" x="992" y="379" font-size="24" font-weight="700" fill="#087f83" data-max-width="386">Appointment / 预约</text>
<text id="text-16" x="992" y="416" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">号源与预约状态查询</text>
<text id="text-17" x="992" y="446" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">准备创建/取消方案</text>
<rect x="40" y="542" width="430" height="158" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="40" y="558" width="5" height="32" rx="2" fill="#956616"/>
<text id="text-18" x="62" y="581" font-size="24" font-weight="700" fill="#956616" data-max-width="386">Triage / 分诊与报告</text>
<text id="text-19" x="62" y="618" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">有限症状的科室方向</text>
<text id="text-20" x="62" y="648" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">预处理与当前事项报告读取</text>
<rect x="505" y="542" width="430" height="158" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="505" y="558" width="5" height="32" rx="2" fill="#956616"/>
<text id="text-21" x="527" y="581" font-size="24" font-weight="700" fill="#956616" data-max-width="386">Medication / 用药资料</text>
<text id="text-22" x="527" y="618" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">两个指定美国药品标签</text>
<text id="text-23" x="527" y="648" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">未知药品/剂型不能据此判断</text>
<rect x="970" y="542" width="430" height="158" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="970" y="558" width="5" height="32" rx="2" fill="#b33f4a"/>
<text id="text-24" x="992" y="581" font-size="24" font-weight="700" fill="#b33f4a" data-max-width="386">Escalation / 联系导诊</text>
<text id="text-25" x="992" y="618" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">固定急症提示、人工联系</text>
<text id="text-26" x="992" y="648" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">不声称已通知工作人员</text>
<text id="text-27" x="40" y="766" font-size="27" font-weight="700" fill="#182f48" data-max-width="1360">三条值得讲清楚的工程链路</text>
<rect x="40" y="800" width="430" height="202" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="40" y="816" width="5" height="32" rx="2" fill="#087f83"/>
<text id="text-28" x="62" y="839" font-size="24" font-weight="700" fill="#087f83" data-max-width="386">预约闭环</text>
<text id="text-29" x="62" y="876" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">工具准备方案，用户显式确认</text>
<text id="text-30" x="62" y="906" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">Redis 乐观事务与库存校验</text>
<text id="text-31" x="62" y="936" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">重复请求重放原回执</text>
<text id="text-32" x="62" y="966" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">完整历史与窗口分开</text>
<rect x="505" y="800" width="430" height="202" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="505" y="816" width="5" height="32" rx="2" fill="#3c62ad"/>
<text id="text-33" x="527" y="839" font-size="24" font-weight="700" fill="#3c62ad" data-max-width="386">知识与协作</text>
<text id="text-34" x="527" y="876" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">按需改写、召回与重排</text>
<text id="text-35" x="527" y="906" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">6 组可主动重载的 Skills</text>
<text id="text-36" x="527" y="936" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">角色工具白名单与有限循环</text>
<text id="text-37" x="527" y="966" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">静态知识与动态事实分开</text>
<rect x="970" y="800" width="430" height="202" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="970" y="816" width="5" height="32" rx="2" fill="#956616"/>
<text id="text-38" x="992" y="839" font-size="24" font-weight="700" fill="#956616" data-max-width="386">报告预处理</text>
<text id="text-39" x="992" y="876" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">文字 / PDF / 图片，本地 OCR</text>
<text id="text-40" x="992" y="906" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">只比较原文明确参考范围</text>
<text id="text-41" x="992" y="936" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">原件不保留，文字/卡片入历史</text>
<text id="text-42" x="992" y="966" font-size="18" font-weight="400" fill="#20384f" data-max-width="386">同一事项继续核对报告</text>
<rect x="40" y="1045" width="1360" height="145" rx="14" fill="#e8f3f3" stroke="#dbe4ed"/>
<text id="text-43" x="62" y="1081" font-size="22" font-weight="700" fill="#087f83" data-max-width="1316">当前验证记录</text>
<text id="text-44" x="62" y="1114" font-size="18" font-weight="400" fill="#20384f" data-max-width="1316">后端 684 passed / 21 skipped；前端 35/35，构建通过；真实存储、OCR 与浏览器另有证据。</text>
<text id="text-45" x="62" y="1142" font-size="18" font-weight="400" fill="#20384f" data-max-width="1316">完整模型 66/66 意图、57/58 结果项；修复后原场景 3/3，未重跑全量。候选未接受。</text>
<text id="text-46" x="62" y="1170" font-size="18" font-weight="400" fill="#20384f" data-max-width="1316">证据入口：docs/internal/updates/U001-health-consultation/evidence/acceptance.md</text>
<rect x="40" y="1207" width="1360" height="164" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="40" y="1223" width="5" height="32" rx="2" fill="#956616"/>
<text id="text-47" x="62" y="1246" font-size="24" font-weight="700" fill="#956616" data-max-width="1316">演示范围与下一步</text>
<text id="text-48" x="62" y="1283" font-size="18" font-weight="400" fill="#20384f" data-max-width="1316">有限症状建议、两个指定美国药品标签；不诊断、不开处方，不代替医生或药师。</text>
<text id="text-49" x="62" y="1313" font-size="18" font-weight="400" fill="#20384f" data-max-width="1316">预约、医院资料均为演示数据；人工导诊提供联系资料。真实医院接入、登录授权与人工接单属于未来构想。</text>
<text id="text-50" x="62" y="1343" font-size="18" font-weight="400" fill="#20384f" data-max-width="1316">技术栈：FastAPI · Vue/Vite · Redis · Chroma · Anthropic SDK · 本地 Tesseract</text>
</g></svg>
