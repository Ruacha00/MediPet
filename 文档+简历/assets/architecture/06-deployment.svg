<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">一份 Compose，四个基础服务</title><desc id="desc">默认端口与持久化关系；Prometheus 为可选 monitoring profile。对应 MediPet U001，源码基准 bb0600c。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6c8499"/></marker></defs>
<rect width="1440" height="1100" fill="#f3f6fa"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif">
<text id="text-1" x="40" y="45" font-size="15" font-weight="700" fill="#087f83" data-max-width="1200">MEDIPET  /  ENGINEERING GUIDE</text>
<text id="text-2" x="40" y="98" font-size="34" font-weight="700" fill="#182f48" data-max-width="1300">一份 Compose，四个基础服务</text>
<text id="text-3" x="40" y="134" font-size="18" font-weight="400" fill="#597087" data-max-width="1360">默认端口与持久化关系；Prometheus 为可选 monitoring profile</text>
<text id="text-4" x="40" y="1073" font-size="15" font-weight="400" fill="#597087" data-max-width="670">06  /  U001 · bb0600c · 2026-09-16</text>
<text id="text-5" x="810" y="1073" font-size="15" font-weight="400" fill="#597087" data-max-width="600">虚构医院演示  ·  图中范围以配套教程与源码为准</text>
<rect x="40" y="177" width="690" height="116" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="40" y="193" width="5" height="32" rx="2" fill="#087f83"/>
<text id="text-6" x="62" y="216" font-size="24" font-weight="700" fill="#087f83" data-max-width="646">浏览器 localhost:8088</text>
<text id="text-7" x="62" y="253" font-size="19" font-weight="400" fill="#20384f" data-max-width="646">Vue 页面通过 /api/python/ 访问同源 API</text>
<rect x="790" y="177" width="610" height="116" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="790" y="193" width="5" height="32" rx="2" fill="#3c62ad"/>
<text id="text-8" x="812" y="216" font-size="24" font-weight="700" fill="#3c62ad" data-max-width="566">外部模型 / DeepSeek 兼容入口</text>
<text id="text-9" x="812" y="253" font-size="18" font-weight="400" fill="#20384f" data-max-width="566">Anthropic SDK；密钥只传入 API，不放前端</text>
<rect x="40" y="343" width="1360" height="462" rx="14" fill="#eaf0f9" stroke="#dbe4ed"/>
<text id="text-10" x="64" y="382" font-size="24" font-weight="700" fill="#3c62ad" data-max-width="1200">Compose 项目 medipet-rebuild</text>
<rect x="65" y="417" width="375" height="158" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="65" y="433" width="5" height="32" rx="2" fill="#087f83"/>
<text id="text-11" x="87" y="456" font-size="24" font-weight="700" fill="#087f83" data-max-width="331">frontend / Nginx</text>
<text id="text-12" x="87" y="493" font-size="18" font-weight="400" fill="#20384f" data-max-width="331">主机 8088 → 容器 80</text>
<text id="text-13" x="87" y="523" font-size="18" font-weight="400" fill="#20384f" data-max-width="331">静态页面与 /api/python 代理</text>
<rect x="510" y="417" width="435" height="158" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="510" y="433" width="5" height="32" rx="2" fill="#3c62ad"/>
<text id="text-14" x="532" y="456" font-size="24" font-weight="700" fill="#3c62ad" data-max-width="391">api / FastAPI</text>
<text id="text-15" x="532" y="493" font-size="18" font-weight="400" fill="#20384f" data-max-width="391">主机 8000 → 容器 8000</text>
<text id="text-16" x="532" y="523" font-size="18" font-weight="400" fill="#20384f" data-max-width="391">本地 PDF + 中英文 OCR</text>
<rect x="1015" y="417" width="360" height="158" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="1015" y="433" width="5" height="32" rx="2" fill="#087f83"/>
<text id="text-17" x="1037" y="456" font-size="24" font-weight="700" fill="#087f83" data-max-width="316">redis / Redis 7</text>
<text id="text-18" x="1037" y="493" font-size="18" font-weight="400" fill="#20384f" data-max-width="316">主机 6379 → 容器 6379</text>
<text id="text-19" x="1037" y="523" font-size="18" font-weight="400" fill="#20384f" data-max-width="316">redis-data 命名卷</text>
<rect x="1015" y="620" width="360" height="145" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="1015" y="636" width="5" height="32" rx="2" fill="#3c62ad"/>
<text id="text-20" x="1037" y="659" font-size="24" font-weight="700" fill="#3c62ad" data-max-width="316">chromadb / 0.5.23</text>
<text id="text-21" x="1037" y="696" font-size="18" font-weight="400" fill="#20384f" data-max-width="316">主机 8001 → 容器 8000</text>
<text id="text-22" x="1037" y="726" font-size="18" font-weight="400" fill="#20384f" data-max-width="316">chroma-data 命名卷</text>
<rect x="65" y="620" width="375" height="145" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="65" y="636" width="5" height="32" rx="2" fill="#087f83"/>
<text id="text-23" x="87" y="659" font-size="24" font-weight="700" fill="#087f83" data-max-width="331">Skills 文件</text>
<text id="text-24" x="87" y="696" font-size="18" font-weight="400" fill="#20384f" data-max-width="331">./skills → /app/skills:ro</text>
<text id="text-25" x="87" y="726" font-size="18" font-weight="400" fill="#20384f" data-max-width="331">编辑后主动重载</text>
<rect x="510" y="620" width="435" height="145" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="510" y="636" width="5" height="32" rx="2" fill="#3c62ad"/>
<text id="text-26" x="532" y="659" font-size="24" font-weight="700" fill="#3c62ad" data-max-width="391">API 数据</text>
<text id="text-27" x="532" y="696" font-size="18" font-weight="400" fill="#20384f" data-max-width="391">api-data → /app/data</text>
<text id="text-28" x="532" y="726" font-size="18" font-weight="400" fill="#20384f" data-max-width="391">评测候选与接受基线</text>
<polyline points="252,293 252,417" fill="none" stroke="#6c8499" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="440,494 510,494" fill="none" stroke="#6c8499" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="945,494 1015,494" fill="none" stroke="#6c8499" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="945,536 980,536 980,689 1015,689" fill="none" stroke="#6c8499" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="725,575 725,620" fill="none" stroke="#6c8499" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<polyline points="440,680 477,680 477,553 510,553" fill="none" stroke="#6c8499" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<polyline points="825,417 825,315 1095,315 1095,293" fill="none" stroke="#6c8499" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="40" y="848" width="660" height="146" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="40" y="864" width="5" height="32" rx="2" fill="#087f83"/>
<text id="text-29" x="62" y="887" font-size="24" font-weight="700" fill="#087f83" data-max-width="616">可选 Prometheus / 9090</text>
<text id="text-30" x="62" y="924" font-size="18" font-weight="400" fill="#20384f" data-max-width="616">仅 monitoring profile 启用，抓取 API 指标</text>
<text id="text-31" x="62" y="954" font-size="18" font-weight="400" fill="#20384f" data-max-width="616">应用内运行状态不依赖它；外部告警默认未配置</text>
<rect x="740" y="848" width="660" height="146" rx="14" fill="white" stroke="#dbe4ed"/>
<rect x="740" y="864" width="5" height="32" rx="2" fill="#3c62ad"/>
<text id="text-32" x="762" y="887" font-size="24" font-weight="700" fill="#3c62ad" data-max-width="616">启动与再次启动</text>
<text id="text-33" x="762" y="924" font-size="18" font-weight="400" fill="#20384f" data-max-width="616">docker compose up --build -d</text>
<text id="text-34" x="762" y="954" font-size="18" font-weight="400" fill="#20384f" data-max-width="616">日常 down 保留命名卷；清空数据用定向脚本</text>
</g></svg>
