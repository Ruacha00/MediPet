name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: medipet
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: medipet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medipet -d medipet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: src
      MEDIPET_TEST_DATABASE_URL: postgresql://medipet:test-password@localhost:5432/medipet_test
      MEDIPET_BENCHMARK_DATABASE_URL: postgresql://medipet:test-password@localhost:5432/medipet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          MEDIPET_DATABASE_URL: ${{ env.MEDIPET_TEST_DATABASE_URL }}
      - name: Run backend tests
        run: uv run pytest --basetemp .pytest-tmp
        env:
          PYTHONTZPATH: /nonexistent
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run python -m medipet.benchmark fake --iterations 2

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v1
        with:
          version: 11.24.0
          runtime: node@22
          cache: true
          cache-dependency-path: apps/web/pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  browser-smoke:
    runs-on: ubuntu-latest
    needs: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: medipet
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: medipet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medipet -d medipet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEDIPET_DATABASE_URL: postgresql://medipet:test-password@localhost:5432/medipet_test
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v1
        with:
          version: 11.24.0
          runtime: node@22
          cache: true
          cache-dependency-path: apps/web/pnpm-lock.yaml
          install: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Start browser test backend
        working-directory: apps/api
        env:
          PYTHONPATH: src
          MEDIPET_ENVIRONMENT: test
          MEDIPET_CAPABILITIES_PATH: ../../capabilities
        run: |
          uv sync
          uv run alembic upgrade head
          uv run python -m medipet.persistence.seed
          uv run uvicorn medipet.delivery.http:app --app-dir src --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/medipet-api.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/medipet-api.log"
              exit 1
            fi
            sleep 1
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv run --with playwright playwright install --with-deps chromium
      - run: pnpm start &
      - run: uv run --with playwright python tests/browser/smoke.py
