server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Full synchronous evaluation includes many model calls (269s in validation).
    location = /api/python/eval/run {
        proxy_pass http://api:8000/eval/run;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
    }

    # 10 MB report file plus bounded multipart framing; API enforces the file limit.
    location = /api/python/reports/preprocess {
        client_max_body_size 11m;
        proxy_pass http://api:8000/reports/preprocess;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location /api/python/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
